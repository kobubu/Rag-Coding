name: Documentation and structural checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Docs and fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install documentation validator
        run: python -m pip install -r requirements-dev.txt
      - name: Check documentation, plan and contracts
        run: python scripts/check_docs.py
      - name: Smoke portable diagnostic CLI
        run: python scripts/probe_flashmt_chunking.py --fixture --output .artifacts/ci-fixture.json
